name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build
        id: build
        run: |
          set -o pipefail
          gradle :app:assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log

      # The outcome and the tail of the log go to a throwaway branch,
      # so a failed build can be diagnosed without opening the Actions page.
      - name: Publish build log
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/ci
          echo "${{ steps.build.outcome }} run=${{ github.run_number }} sha=${{ github.sha }}" > /tmp/ci/status.txt
          if [ -f build.log ]; then
            grep -nE "^e: |^w: .*deprecated|error:|FAILED|What went wrong|Could not|Unresolved|not found" build.log | head -n 200 > /tmp/ci/errors.txt || true
            tail -n 250 build.log > /tmp/ci/build-tail.log
          fi
          cd /tmp/ci
          git init -q -b ci-logs
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add .
          git commit -q -m "Build log for run ${{ github.run_number }}"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}" ci-logs

      - name: Publish APK
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk habit-tracker.apk
          gh release create "v0.1.${{ github.run_number }}" habit-tracker.apk \
            --title "Звички 0.1.${{ github.run_number }}" \
            --notes "Збірка з коміту ${{ github.sha }}" \
            --latest
